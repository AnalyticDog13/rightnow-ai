name: ci
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # D50: high and critical findings in production dependencies fail the build
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
  imap-real:
    # The provider contract against a real IMAP/SMTP server (GreenMail, no CONDSTORE). Required for the phase gate.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      greenmail:
        image: greenmail/standalone:2.1.14
        ports:
          - 3025:3025
          - 3143:3143
        env:
          GREENMAIL_OPTS: >-
            -Dgreenmail.setup.test.smtp -Dgreenmail.setup.test.imap
            -Dgreenmail.hostname=0.0.0.0
            -Dgreenmail.users=me:secret@rn.test,to:secret@rn.test,hidden:secret@rn.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Wait for GreenMail
        run: |
          for i in $(seq 60); do
            (echo > /dev/tcp/127.0.0.1/3143) 2>/dev/null && (echo > /dev/tcp/127.0.0.1/3025) 2>/dev/null && exit 0
            sleep 2
          done
          echo "::error::GreenMail did not open its ports"; exit 1
      - name: Provider contract against GreenMail
        # 127.0.0.1 in local mode: plain ports are allowed only for a loopback host when MODE=local
        env:
          MODE: local
          IMAP_TEST_URL: imap://me:secret@127.0.0.1:3143?smtp=3025&address=me@rn.test
        run: npx vitest run packages/providers/test/imap.real.test.ts
      - name: Diagnostics
        if: failure()
        run: |
          docker ps -a
          docker logs "$(docker ps -aq --filter ancestor=greenmail/standalone:2.1.14 | head -1)" 2>&1 | tail -60 | head -c 6000 | tr "\n" "|" | sed "s/^/::error title=greenmail logs::/"
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate Caddyfile
        run: docker run --rm -e DOMAIN=app.example.com -v "$PWD/docker/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Create .env
        run: |
          cp .env.example .env
          sed -i "s|^ENCRYPTION_KEY=.*|ENCRYPTION_KEY=$(openssl rand -base64 32)|" .env
          sed -i "s|^BETTER_AUTH_SECRET=.*|BETTER_AUTH_SECRET=$(openssl rand -base64 32)|" .env
          sed -i "s|^SETUP_TOKEN=.*|SETUP_TOKEN=ci-setup-token-0123456789|" .env
      - name: Build and start
        run: docker compose up -d --build
      - name: Healthy
        run: |
          for i in $(seq 60); do curl -fsS http://localhost:3000/api/healthz && exit 0; sleep 2; done
          exit 1
      - name: Backup
        run: |
          docker compose exec -T postgres psql -U rightnow -d rightnow -c "create table ci_marker as select 42 as v"
          docker compose run --rm --no-deps migrate migration-check seed
          sh scripts/backup.sh
      - name: Fresh volume
        run: |
          docker compose down -v
          docker compose up -d --build
          for i in $(seq 60); do curl -fsS http://localhost:3000/api/healthz && exit 0; sleep 2; done
          exit 1
      - name: Bad dump is rejected and changes nothing
        run: |
          echo junk > backups/bad.dump
          if sh scripts/restore.sh backups/bad.dump; then echo "bad dump accepted"; exit 1; fi
          docker compose exec -T postgres psql -U rightnow -d rightnow -tAc "select count(*) from _prisma_migrations" | grep -qx "$(ls -d packages/db/prisma/migrations/*/ | wc -l)"
          curl -fsS http://localhost:3000/api/healthz
      - name: Restore
        run: |
          if docker compose exec -T postgres psql -U rightnow -d rightnow -tAc "select v from ci_marker"; then echo "marker present before restore"; exit 1; fi
          sh scripts/restore.sh backups/rightnow-*.dump
          ls -l backups
          test "$(stat -c %a backups)" = 700
          test "$(stat -c %a backups/rightnow-*.dump)" = 600
          ls backups/pre-restore-*.dump
      - name: Healthy after restore, data back
        run: |
          ok=
          for i in $(seq 60); do curl -fsS http://localhost:3000/api/healthz && ok=1 && break; sleep 2; done
          test -n "$ok"
          docker compose exec -T postgres psql -U rightnow -d rightnow -tAc "select v from ci_marker" | grep -qx 42
          # the worker's heartbeat reaches the restored database, so readiness turns green
          ok=
          for i in $(seq 40); do curl -fsS http://localhost:3000/api/readyz && ok=1 && break; sleep 3; done
          test -n "$ok"
          for svc in web worker; do
            ok=
            for i in $(seq 40); do
              [ "$(docker compose ps --format '{{.Health}}' $svc)" = healthy ] && ok=1 && break
              sleep 3
            done
            test -n "$ok" || { echo "$svc not healthy"; exit 1; }
          done
          docker compose exec -T web id -u | grep -vqx 0
      - name: Migration fixture survives restore
        run: docker compose run --rm --no-deps migrate migration-check verify
      - name: Wrong key is detected
        run: |
          if docker compose run --rm --no-deps -e ENCRYPTION_KEY="$(openssl rand -base64 32)" migrate migration-check verify; then echo "wrong key accepted"; exit 1; fi
      - name: Rotate key runs in Compose
        run: |
          # limit: the only credential row is the migration fixture (1 re-encrypted); correctness is packages/core/test/rotate.test.ts
          out=$(sh scripts/rotate-key.sh)
          echo "$out" | grep -v -e '^New ENCRYPTION_KEY' -e '^Next:'
          echo "$out" | grep -qx "EmailAccount.credentialsEnc: re-encrypted 1"
          new=$(echo "$out" | sed -n 's/^New ENCRYPTION_KEY[^:]*: //p')
          test -n "$new"
          docker compose run --rm --no-deps -e ENCRYPTION_KEY="$new" migrate migration-check verify
          # .env still holds the old key: start again on it and check readiness
          docker compose up -d
          ok=
          for i in $(seq 40); do curl -fsS http://localhost:3000/api/readyz && ok=1 && break; sleep 3; done
          test -n "$ok"
      - name: Diagnostics
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --tail=40 | head -c 6000 | tr '\n' '|' | sed 's/^/::error title=compose logs::/'
