name: ci
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Create .env
        run: |
          cp .env.example .env
          sed -i "s|^ENCRYPTION_KEY=.*|ENCRYPTION_KEY=$(openssl rand -base64 32)|" .env
          sed -i "s|^BETTER_AUTH_SECRET=.*|BETTER_AUTH_SECRET=$(openssl rand -base64 32)|" .env
          sed -i "s|^SETUP_TOKEN=.*|SETUP_TOKEN=ci-setup-token-0123456789|" .env
      - name: Build and start
        run: docker compose up -d --build
      - name: Healthy
        run: |
          for i in $(seq 60); do curl -fsS http://localhost:3000/api/healthz && exit 0; sleep 2; done
          exit 1
      - name: Backup
        run: |
          docker compose exec -T postgres psql -U rightnow -d rightnow -c "create table ci_marker as select 42 as v"
          sh scripts/backup.sh
      - name: Fresh volume
        run: |
          docker compose down -v
          docker compose up -d --build
          for i in $(seq 60); do curl -fsS http://localhost:3000/api/healthz && exit 0; sleep 2; done
          exit 1
      - name: Bad dump is rejected and changes nothing
        run: |
          echo junk > backups/bad.dump
          if sh scripts/restore.sh backups/bad.dump; then echo "bad dump accepted"; exit 1; fi
          docker compose exec -T postgres psql -U rightnow -d rightnow -tAc "select count(*) from _prisma_migrations" | grep -qx "$(ls -d packages/db/prisma/migrations/*/ | wc -l)"
          curl -fsS http://localhost:3000/api/healthz
      - name: Restore
        run: |
          if docker compose exec -T postgres psql -U rightnow -d rightnow -tAc "select v from ci_marker"; then echo "marker present before restore"; exit 1; fi
          sh scripts/restore.sh backups/rightnow-*.dump
          ls -l backups
          test "$(stat -c %a backups)" = 700
          test "$(stat -c %a backups/rightnow-*.dump)" = 600
          ls backups/pre-restore-*.dump
      - name: Healthy after restore, data back
        run: |
          ok=
          for i in $(seq 60); do curl -fsS http://localhost:3000/api/healthz && ok=1 && break; sleep 2; done
          test -n "$ok"
          docker compose exec -T postgres psql -U rightnow -d rightnow -tAc "select v from ci_marker" | grep -qx 42
          # the worker's heartbeat reaches the restored database, so readiness turns green
          ok=
          for i in $(seq 40); do curl -fsS http://localhost:3000/api/readyz && ok=1 && break; sleep 3; done
          test -n "$ok"
          for svc in web worker; do
            ok=
            for i in $(seq 40); do
              [ "$(docker compose ps --format '{{.Health}}' $svc)" = healthy ] && ok=1 && break
              sleep 3
            done
            test -n "$ok" || { echo "$svc not healthy"; exit 1; }
          done
          docker compose exec -T web id -u | grep -vqx 0
      - name: Diagnostics
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --tail=40 | head -c 6000 | tr '\n' '|' | sed 's/^/::error title=compose logs::/'
