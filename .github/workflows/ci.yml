name: ci
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Create .env
        run: |
          cp .env.example .env
          sed -i "s|^ENCRYPTION_KEY=.*|ENCRYPTION_KEY=$(openssl rand -base64 32)|" .env
          sed -i "s|^BETTER_AUTH_SECRET=.*|BETTER_AUTH_SECRET=$(openssl rand -base64 32)|" .env
          sed -i "s|^SETUP_TOKEN=.*|SETUP_TOKEN=ci-setup-token-0123456789|" .env
      - name: Up, backup, restore into a fresh volume
        run: |
          set -e
          dump() { m=$( (docker compose ps -a; docker compose logs --tail=40) 2>&1 | tail -c 12000 | sed ':a;N;$!ba;s/%/%25/g;s///g;s/
/%0A/g'); echo "::error title=compose diagnostics::$m"; }
          wait_health() {
            for i in $(seq 60); do
              curl -fsS http://localhost:3000/api/healthz && return 0
              sleep 2
            done
            dump; return 1
          }
          docker compose up -d --build || { dump; exit 1; }
          wait_health
          docker compose exec -T postgres psql -U rightnow -d rightnow -c "create table ci_marker as select 42 as v"
          sh scripts/backup.sh
          docker compose down -v
          docker compose up -d --build || { dump; exit 1; }
          wait_health
          sh scripts/restore.sh backups/*.dump || { dump; exit 1; }
          wait_health
          docker compose exec -T postgres psql -U rightnow -d rightnow -tAc "select v from ci_marker" | grep -qx 42
          docker compose ps
      - if: failure()
        run: docker compose ps -a; docker compose logs --tail=100
